<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Listas de precios · Dulce Sall Admin</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app-v2.css">
    <link rel="manifest" href="manifest.json">

    <link rel="icon" type="image/png" sizes="192x192" href="/assets/logo-192.png?v=2">
    <link rel="shortcut icon" type="image/png" href="/assets/logo-192.png?v=2">
    <meta name="theme-color" content="#ff96c5">

    <!-- ========================================== -->
    <!-- ETIQUETAS EXCLUSIVAS Y OBLIGATORIAS PARA APPLE / iOS -->
    <!-- ========================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dulce Sall">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <!-- ========================================== -->

    <!-- ====================================================== -->
    <!-- LIBRERÍAS PARA GENERAR PDF (MUY IMPORTANTE)            -->
    <!-- ====================================================== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="ds-app ds-content ds-prices">
    <div class="main-container">
        <!-- HEADER -->
        <header class="header">
            <button class="header__menu-icon" id="menu-toggle-btn" aria-label="Abrir menú">
                <span></span><span></span><span></span>
            </button>
            <a href="index.html" class="header__logo-link">
                <img src="assets/logo.png" alt="Logo de Dulce App" class="header__logo">
            </a>
            <div class="header__spacer"></div>
        </header>

        <!-- MENÚ DINÁMICO (Inyectado por menu.js) -->
        <nav class="nav-menu" id="nav-menu"></nav>
        <div class="nav-menu__overlay" id="nav-overlay"></div>

        <main class="ds-content-main"><div class="ds-content-wrap">
                <section class="ds-content-head"><div><p class="ds-eyebrow">Operación</p><h1>Listas de precios</h1><p>Calculá costos y generá listas mayoristas o minoristas en PDF.</p></div></section>

            <!-- Panel de Control para Descargas PDF -->
            <section class="card">
                <h2 class="card__title">Generar Listas de Precios en PDF</h2>
                <div class="form-modern">
                    <div class="form-group">
                        <label for="porcentaje-mayorista">Ganancia Mayorista (%)</label>
                        <input type="number" id="porcentaje-mayorista" placeholder="Ej: 30" value="30">
                    </div>
                    <div class="form-group">
                        <label for="porcentaje-minorista">Ganancia Minorista (%)</label>
                        <input type="number" id="porcentaje-minorista" placeholder="Ej: 70" value="70">
                    </div>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-light); text-align: center; margin-top: 1rem;">
                    El PDF se generará con el logo de tu app como marca de agua.
                </p>
                <div class="modal-actions" style="justify-content: center; gap: 1rem; margin-top: 1.5rem;">
                    <button id="btn-pdf-costo" class="btn-secondary">Descargar Costos</button>
                    <button id="btn-pdf-mayorista" class="btn-primary">Descargar Lista Mayorista</button>
                    <button id="btn-pdf-minorista" class="btn-primary">Descargar Lista Minorista</button>
                </div>
            </section>

            <!-- Vista Rápida de Costos de Producción -->
            <section class="card">
                <div class="card-header-actions">
                    <h2 class="card__title">Vista Rápida de Costos de Producción (por unidad)</h2>
                </div>
                <div id="lista-precios-container">
                    <p>Calculando costos, por favor espera...</p>
                </div>
            </section>
            </div>
        </main>
    </div>
    
    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { firebaseConfig } from './js/firebase-config.js';
        import { setupPrecios } from './js/precios.js';
        try {
            const app = initializeApp(firebaseConfig);
            setupPrecios(app);
        } catch (error) { console.error(error); }
    </script>
    <script src="js/menu.js?v=12" defer></script>
    <script src="js/shell-v2.js?v=2" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
        }
    </script>
</body>
</html>
