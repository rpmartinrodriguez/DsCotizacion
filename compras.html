<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Compras - Dulce App</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff96c5">

    <!-- ========================================== -->
    <!-- ETIQUETAS EXCLUSIVAS Y OBLIGATORIAS PARA APPLE / iOS -->
    <!-- ========================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dulce App">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <!-- ========================================== -->
</head>
<body>
    <div class="main-container">
        <!-- HEADER -->
        <header class="header">
            <button class="header__menu-icon" id="menu-toggle-btn" aria-label="Abrir menú">
                <span></span><span></span><span></span>
            </button>
            <a href="index.html" class="header__logo-link">
                <img src="assets/logo.png" alt="Logo de Dulce App" class="header__logo">
            </a>
            <div class="header__spacer"></div>
        </header>

        <!-- MENÚ DINÁMICO (Inyectado por menu.js) -->
        <nav class="nav-menu" id="nav-menu"></nav>        
        <div class="nav-menu__overlay" id="nav-overlay"></div>
        
        <main>
            <section class="card">
                <h2 class="card__title">Registrar Nueva Compra de Materia Prima</h2>
                <form id="form-nueva-compra">
                    <div class="form-modern" style="grid-template-columns: 1fr 1fr;">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="nombre-producto">Nombre del Producto</label>
                            <input type="text" id="nombre-producto" required list="lista-productos-existentes" placeholder="Escribe o selecciona un producto">
                            <datalist id="lista-productos-existentes"></datalist>
                        </div>
                        <div class="form-group">
                            <label for="precio-compra">Precio por Unidad ($)</label>
                            <input type="number" id="precio-compra" step="0.01" required placeholder="Ej: 2000">
                        </div>
                        <div class="form-group">
                            <label for="unidades-compradas">Unidades Compradas</label>
                            <input type="number" id="unidades-compradas" step="1" required placeholder="Ej: 4">
                        </div>
                        <div class="form-group">
                            <label for="cantidad-por-unidad">Contenido por Unidad</label>
                            <input type="number" id="cantidad-por-unidad" step="any" required placeholder="Ej: 500">
                        </div>
                        <div class="form-group">
                            <label for="unidad-medida">Unidad de Medida</label>
                            <select id="unidad-medida" required>
                                <option value="gr">Gramo (gr)</option>
                                <option value="kg">Kilogramo (kg)</option>
                                <option value="l">Litro (l)</option>
                                <option value="ml">Mililitro (ml)</option>
                                <option value="unidad">Unidad</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="btn-guardar-compra" class="btn-primary">Guardar Compra</button>
                </form>
            </section>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { firebaseConfig } from './js/firebase-config.js';
        import { setupCompras } from './js/compras.js';
        try {
            const app = initializeApp(firebaseConfig);
            setupCompras(app);
        } catch (error) { console.error(error); }
    </script>
    <script src="js/menu.js?v=11" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
