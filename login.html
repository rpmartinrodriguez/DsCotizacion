<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ingresar - Dulce App</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fdf2f8">

    <!-- ========================================== -->
    <!-- ETIQUETAS EXCLUSIVAS Y OBLIGATORIAS PARA APPLE / iOS -->
    <!-- ========================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dulce App">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <!-- ========================================== -->

    <style>
        body {
            background-color: #fdf2f8; /* Fondo rosado muy suave */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .login-container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo {
            width: 120px;
            margin-bottom: 1.5rem;
        }
        .login-title {
            color: #831843;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            font-weight: 900;
        }
        .login-subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #475569;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: #ec4899;
        }
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: #ec4899;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }
        .btn-login:hover {
            background: #be185d;
        }
        .btn-login:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        .error-message {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
            text-align: left;
        }
        .registro-link {
            display: block;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #64748b;
        }
        .registro-link a {
            color: #ec4899;
            font-weight: bold;
            text-decoration: none;
        }
        .registro-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="assets/logo.png" alt="Dulce App Logo" class="login-logo" onerror="this.style.display='none'">
        <h1 class="login-title">Dulce App</h1>
        <p class="login-subtitle">Ingresá tus credenciales para acceder</p>

        <div class="error-message" id="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="ejemplo@dulceapp.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="btn-submit">Ingresar al Sistema</button>
        </form>

        <div class="registro-link" id="registro-container" style="display: none;">
            ¿No tenés cuenta? <a href="#" id="btn-registrar">Crear cuenta nueva</a>
        </div>
    </div>

    <!-- SCRIPT DE LOGIN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { firebaseConfig } from './js/firebase-config.js';
        import { setupLogin } from './js/login.js?v=2';
        
        try {
            const app = initializeApp(firebaseConfig);
            setupLogin(app);
        } catch(e) {
            console.error("Error inicializando app:", e);
        }
    </script>
    
    <!-- REGISTRO DEL SERVICE WORKER PARA PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW falló:', err));
            });
        }
    </script>
</body>
</html>
