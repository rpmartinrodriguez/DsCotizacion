<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista de Compras - Dulce App</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff96c5">    

    <!-- ========================================== -->
    <!-- ETIQUETAS EXCLUSIVAS Y OBLIGATORIAS PARA APPLE / iOS -->
    <!-- ========================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dulce App">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <!-- ========================================== -->
</head>
<body>
    <div class="main-container">
        <!-- HEADER -->
        <header class="header">
            <button class="header__menu-icon" id="menu-toggle-btn" aria-label="Abrir menú">
                <span></span><span></span><span></span>
            </button>
            <a href="index.html" class="header__logo-link">
                <img src="assets/logo.png" alt="Logo de Dulce App" class="header__logo">
            </a>
            <div class="header__spacer"></div>
        </header>

        <!-- MENÚ DINÁMICO (Inyectado por menu.js) -->
        <nav class="nav-menu" id="nav-menu"></nav>        
        <div class="nav-menu__overlay" id="nav-overlay"></div>

        <main>
            <section class="card">
                <h2 class="card__title">Lista de Compras Automática</h2>
                <p class="text-light" style="margin-top: -1rem; margin-bottom: 1.5rem;">
                    Esta es la lista de todos los ingredientes que necesitas comprar para cumplir con tus próximas <strong>5 ventas agendadas</strong>.
                </p>
                <div id="lista-compras-container">
                    <p>Calculando lista...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { firebaseConfig } from './js/firebase-config.js';
        import { setupListaCompras } from './js/compras-lista.js';
        try {
            const app = initializeApp(firebaseConfig);
            setupListaCompras(app);
        } catch (error) { console.error(error); }
    </script>
    <script src="js/menu.js?v=11" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
