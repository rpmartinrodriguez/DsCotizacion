<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Stock - Dulce App</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff96c5">

    <!-- ========================================== -->
    <!-- ETIQUETAS EXCLUSIVAS Y OBLIGATORIAS PARA APPLE / iOS -->
    <!-- ========================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dulce App">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <!-- ========================================== -->
</head>
<body>
    <div class="main-container">
        <!-- HEADER -->
        <header class="header">
            <button class="header__menu-icon" id="menu-toggle-btn" aria-label="Abrir menú">
                <span></span><span></span><span></span>
            </button>
            <a href="index.html" class="header__logo-link">
                <img src="assets/logo.png" alt="Logo de Dulce App" class="header__logo">
            </a>
            <div class="header__spacer"></div>
        </header>

        <!-- MENÚ DINÁMICO (Inyectado por menu.js) -->
        <nav class="nav-menu" id="nav-menu"></nav>        
        <div class="nav-menu__overlay" id="nav-overlay"></div>

        <main>
            <section class="card">
                <div class="card-header-actions">
                    <h2 class="card__title">Inventario de Materias Primas</h2>
                    <a href="compras.html" class="btn-primary">Registrar Nueva Compra</a>
                </div>
                <div class="buscador-container">
                    <input type="search" id="buscador-stock" placeholder="🔍 Buscar por nombre...">
                </div>
                <table class="table-clean" id="tabla-stock">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Stock Actual</th>
                            <th>Precio Base (Última Compra)</th>
                            <th>Última Carga</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="5" style="text-align: center;">Cargando stock...</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    
    <!-- Modal para Edición Completa de Lotes -->
    <div id="edit-producto-completo-modal-overlay" class="modal-overlay">
        <div class="modal-content card">
            <h2 class="card__title" id="producto-completo-modal-title">Editar Producto</h2>
            <div class="modal-body">
                <div class="form-modern" style="grid-template-columns: 2fr 1fr;">
                    <div class="form-group">
                        <label for="producto-nombre-completo-input">Nombre del Producto</label>
                        <input type="text" id="producto-nombre-completo-input">
                    </div>
                    <div class="form-group">
                        <label for="producto-unidad-completo-select">Unidad</label>
                        <select id="producto-unidad-completo-select">
                            <option value="gr">Gramos (gr)</option>
                            <option value="kg">Kilos (kg)</option>
                            <option value="unidad">Unidad</option>
                            <option value="cc">cc</option>
                            <option value="ml">ml</option>
                            <option value="l">Litros (l)</option>
                        </select>
                    </div>
                </div>
                <h4 class="card__subtitle">Lotes de Compra</h4>
                <div id="lotes-editor-container" class="lotes-editor-container">
                    <p>Cargando lotes...</p>
                </div>
            </div>
            <div class="modal-actions">
                <button id="producto-completo-modal-btn-cancelar" class="btn-secondary">Cancelar</button>
                <button id="producto-completo-modal-btn-guardar" class="btn-primary">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- Nuevo Modal para Ajuste Rápido de Stock -->
    <div id="ajustar-stock-modal-overlay" class="modal-overlay">
        <div class="modal-content card">
            <h2 class="card__title" id="ajustar-stock-modal-title">Ajustar Stock Total</h2>
            <div class="modal-body">
                <p>Estás ajustando el stock de: <strong id="ajustar-stock-nombre-producto"></strong></p>
                <div class="form-group">
                    <label>Stock Actual Calculado</label>
                    <input type="text" id="stock-actual-calculado" disabled>
                </div>
                <div class="form-group">
                    <label for="nuevo-stock-real">Nuevo Stock Real (la cantidad que contaste)</label>
                    <input type="number" id="nuevo-stock-real" step="any" placeholder="Ingresa la cantidad correcta">
                </div>
            </div>
            <div class="modal-actions">
                <button id="ajustar-stock-btn-cancelar" class="btn-secondary">Cancelar</button>
                <button id="ajustar-stock-btn-guardar" class="btn-primary">Confirmar Ajuste</button>
            </div>
        </div>
    </div>

    <!-- Modal de Historial -->
    <div id="historial-movimientos-modal-overlay" class="modal-overlay">
        <div class="modal-content card">
            <h2 class="card__title" id="movimientos-modal-title">Historial de Movimientos</h2>
            <div id="movimientos-lista-container" class="movimientos-container">
                <p>Cargando historial...</p>
            </div>
            <div class="modal-actions">
                <button id="movimientos-modal-btn-cerrar" class="btn-primary">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { firebaseConfig } from './js/firebase-config.js';
        import { setupStock } from './js/stock.js';
        try {
            const app = initializeApp(firebaseConfig);
            setupStock(app);
        } catch (error) { console.error(error); }
    </script>
    <script src="js/menu.js?v=11" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
        }
    </script>
</body>
</html>
